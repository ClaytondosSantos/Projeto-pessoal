<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./resposivo.css">
    <title>Barbearia</title>
</head>

<body>
    <div class="img">
        <img class="banner" src="./image/banner.jpg" alt="">
    </div> 
    
        <span class="material-symbols-outlined" id="menu">menu</span>  

    <header class="menu">
        <ul>
            <li><a href="#" class=" link">SERVIÇOS</a></li>
            <li><a href="#" class="link">GALERIA</a></li>
            <li><a href="https://wa.me/" class="link">CONTATO</a></li>
        </ul>
        <img class="logo-1" src="./image/logo-1.jpg" alt="">
    </header>

    <section class="sessão-pag-incial">        
        <div class="botao-agendar-plano">
            <a href="#planos"><button class="btn-escolher-plano">
                ESCOLHA SEU PLANO</button></a>

            <a href="#cadastro"><button class="btn-agendar-horario">
                 AGENDE SEU HORÁRIO</button></a>         
        </div>


        <div class="texto-pg-incial">
            <div class="titulo">
                <h1> Cortes de cabelos e barbas impecáveis!</h1>
            </div>

            <div>
                <p class="texto-incio"> Trabalhamos para elevar sua autoestima! </p>
            </div>
        </div>
    </section>


    <section class="planos" id="planos">

        <button class="plano-mensal" onclick="confirmar()">
            <h3>PLANO MENSAL</h3>
            <p>
                Corte de cabelo a partir de R$ 120,00.
            </p>
            <p>
                Corte de barba a partir de R$ 80,00.
            </p>
            <P>
                Combo a partir de R$ 200,00.
            </P>
        </button>

        <div class="titulo-planos">
            <h2>FAÇA SEU PLANO</h2>
        </div>


        <button class="plano-anual" onclick="confirmar()">
            <h3>PLANO ANUAL</h3>
            <p>
                Corte de cabelo a partir de R$ 1400,00.
            </p>
            <p>
                Corte de barba a partir de R$ 920,00
            </p>
            <P>
                Combo a partir de R$ 2300,00.
            </P>
        </button>


    </section>

    <section class="back-cadastro">
        <div class="texto-cadastro">
            <h2>Agende o seu horário de onde estiver!
                Atendimento de segunda à sábado das 9:00 às 20:00.</h2>
        </div>
        <div class="banner-cadastro">
            <div>
                <img src="./image/foto-corte cabelo.jpg" alt="">
            </div>

            <div>
                <img src="./image/foto-corte-barba.jpg" alt="">
            </div>
        </div>

        <div class="cortes">
            <div>
                <p>CORTE DE CABELO</p>
            </div>
            <div>
                <p>CORTE DE BARBA</p>
            </div>
            <!--action="https://formcarry.com/s/REVB83jobEX" method="POST"
            enctype="multipart/form-data" -->
        </div>
        <form class="sessao-cadastro" >
            <div class="input-nome">
                <input class="input-nome" placeholder="Nome" type=" text" name="nome" id="cadastro">
            </div>
            <div class="input-data">
                <input class="input-data" placeholder="data" type="date" name="data">
            </div>
            <div class="input-hora">
                <input class="input-hora" placeholder="horário" type="time" name="horas" id="input-hora">
            </div>      
            <div class="btn-confirmar">
                <button>CONFIRMAR</button>
            </div>  
        </form>        

        <footer>
            <div class="rodape">
                <img src="./image/textura-de-concreto-preto.jpg" alt=""> 
            </div>            
                               
        </footer>

        <script src="./index.js"></script>

</body>

</html>
